params:
  - id: paseo_password
    type: secret
    name: Paseo Password
    description: Required daemon connection password. A random password is generated by default.
    optional: false
    default_value: "$random(len=32)"
  - id: paseo_hostnames
    type: string
    name: Paseo Hostnames
    description: Comma-separated DNS names without scheme or port. Leave empty to use the LazyCat application domain.
    optional: true
    default_value: ""
locales:
  zh:
    paseo_password:
      name: Paseo 连接密码
      description: 必填，默认自动生成随机密码；也可设置自己的密码。
    paseo_hostnames:
      name: Paseo 允许的域名
      description: 多个域名用英文逗号分隔，不含协议和端口；留空使用懒猫应用域名。自定义时请包含当前应用域名。
